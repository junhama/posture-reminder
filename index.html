<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="良い姿勢を保つためのリマインダーアプリ。カスタムメッセージ、通知音、時間帯指定に対応。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Posture Reminder">
  <title>Posture Reminder — 良い姿勢を習慣に</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Skip link for accessibility -->
  <a href="#main" class="skip-link">メインコンテンツへ</a>

  <div class="container" id="main">
    <header>
      <h1>💺 Posture Reminder</h1>
      <p class="subtitle">良い姿勢を保つためのリマインダーアプリ</p>
    </header>

    <!-- ステータス / 次の通知カウントダウン -->
    <div id="status" class="status card">
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <p>状態: <span id="status-text">停止中</span></p>
      </div>
      <p class="countdown" id="countdown" hidden>次の通知まで <span id="countdown-time">--:--</span></p>
      <p class="today-count" id="today-count" hidden>今日の通知回数: <span id="today-count-num">0</span> 回</p>
    </div>

    <!-- 設定 -->
    <div class="settings card">
      <h2>⚙️ 設定</h2>
      <div class="setting-item">
        <label for="interval">通知間隔</label>
        <select id="interval">
          <option value="15">15分</option>
          <option value="30" selected>30分</option>
          <option value="60">1時間</option>
          <option value="120">2時間</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="message">通知メッセージ</label>
        <input type="text" id="message" maxlength="60" placeholder="背筋を伸ばして、肩をリラックスさせましょう" value="背筋を伸ばして、肩をリラックスさせましょう">
      </div>
      <div class="setting-item">
        <label for="sound-toggle">
          <input type="checkbox" id="sound-toggle" checked>
          通知音を鳴らす
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="enabled" checked>
          通知を有効にする
        </label>
      </div>
      <div class="setting-item setting-column">
        <label>通知する時間帯</label>
        <div class="time-range">
          <input type="time" id="start-time" value="09:00" aria-label="開始時刻">
          <span>〜</span>
          <input type="time" id="end-time" value="22:00" aria-label="終了時刻">
        </div>
      </div>
    </div>

    <!-- 操作 -->
    <div class="controls">
      <button id="start-btn">リマインダー開始</button>
      <button id="stop-btn">リマインダー停止</button>
    </div>
    <div class="controls secondary">
      <button id="test-btn" class="ghost">テスト通知</button>
    </div>

    <!-- サポート / 投げ銭 -->
    <div class="support card">
      <h2>💛 サポート</h2>
      <p class="support-desc">
        このアプリは無料でご利用いただけます。開発の継続と機能追加のため、
        よろしければサポートをお願いします 🙏
      </p>
      <div class="support-buttons">
        <a href="https://ko-fi.com/" target="_blank" rel="noopener noreferrer" class="donate-btn ko-fi" aria-label="Ko-fiでサポート">
          ☕ Ko-fiで応援する
        </a>
        <a href="https://www.buymeacoffee.com/" target="_blank" rel="noopener noreferrer" class="donate-btn bmc" aria-label="Buy Me a Coffeeでサポート">
          🍺 Buy Me a Coffee
        </a>
      </div>
      <p class="supporter-note" id="supporter-note" hidden>🎉 サポーター登録ありがとうございます！</p>
      <button id="supporter-btn" class="ghost small">サポーターとして登録する</button>
    </div>

    <footer>
      <p>Posture Reminder V2 · あなたの姿勢を応援します</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
